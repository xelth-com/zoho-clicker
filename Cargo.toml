[package]
name = "zoho-clicker"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Simple CLI tool for automating Zoho People check-in/check-out"
repository = "https://github.com/xelth-com/zoho-clicker"

[dependencies]
thirtyfour = "0.35"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
log = "0.4"
simplelog = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
